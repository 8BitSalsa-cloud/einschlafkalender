<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Schlaf Kalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     EINSTELLUNGEN
     --sheet-image: hier dein Hintergrundbild eintragen, z. B.
       --sheet-image: url("img/blatt.jpg");
     Am besten eine Version NUR mit Papier + eingerollter Ecke,
     ohne gezeichnete Linien/Player – die macht die Seite selbst.
     ========================================================= */
  :root{
    --ink:#38312a;
    --ink-soft:rgba(56,49,42,.32);
    --red:#c8202a;      /* Sonn- und Feiertage */
    --paper:#f3efe8;
    --sheet-image:url("assets/blatt.webp");  /* oder: url("img/blatt.jpg") */
    --dim-delay:10;      /* Sekunden bis zum Abdunkeln */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink);
    overflow:hidden;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- Blatt (2:3, wie das Hintergrundbild) ---------- */
  .sheet{
    position:relative;aspect-ratio:2/3;
    height:min(100svh,150vw);
    container-type:inline-size;
  }
  .page{
    position:absolute;inset:0;
    background:var(--sheet-image),var(--paper);
    background-size:100% 100%;background-position:center;
    box-shadow:0 0 60px rgba(0,0,0,.6);
    overflow:hidden;
  }
  /* eingerollte Ecke oben (nur Platzhalter, entfällt mit eigenem Bild) */
  .curl{
    position:absolute;left:0;right:0;top:0;height:6.5%;
    background:linear-gradient(to bottom,#f2ebdf 0%,#e6dccb 55%,#cfc3ae 100%);
    box-shadow:0 .6cqw 1.4cqw rgba(0,0,0,.18);
    border-bottom-right-radius:60% 100%;
  }
  .curl::before{
    content:"";position:absolute;left:0;top:0;width:7%;height:150%;
    border-radius:0 0 50% 50%;
    background:radial-gradient(circle at 60% 40%,#f5efe4,#d4c8b3 70%);
    box-shadow:.4cqw .6cqw 1cqw rgba(0,0,0,.2);
  }
  .has-image .curl{display:none}


  /* ---------- Kopf: Titel | Tageszahl ---------- */
  .head{
    position:absolute;top:15.2%;height:6.45%;left:6%;right:5.3%;
    border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
    display:grid;grid-template-columns:1fr 23.5%;
  }
  .head .title{display:flex;flex-direction:column;justify-content:center;padding-left:2cqw;min-width:0}
  .label{font-size:2.2cqw;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
  .story{font-size:4cqw;font-weight:600;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head .date{border-left:1px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.9}
  .head .date svg{width:6cqw;height:6cqw}
  .moonname{font-size:2.3cqw;font-style:italic;opacity:.75;margin-top:.8cqw;text-align:center;line-height:1.1}

  /* ---------- Mittelfläche: Abreißkalender-Datum ---------- */
  .body{
    position:absolute;top:21.6%;bottom:26.9%;left:6%;right:5.3%;
    padding:2.5cqw 3cqw 3.2cqw;overflow:hidden;display:flex;flex-direction:column;align-items:center;
    text-align:center;font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  .body > *{flex-shrink:0}
  .toprow{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;font-size:3.5cqw}
  .toprow span:first-child{text-align:left}
  .toprow span:last-child{text-align:right}
  .monthlong{font-size:7cqw;font-weight:700}
  .bignum{
    font-family:"Anton","Oswald","Arial Narrow",Impact,sans-serif;font-weight:400;
    font-size:31cqw;line-height:.98;letter-spacing:-.01em;margin:.5cqw 0 0;
  }
  .rot .bignum{color:var(--red)}
  .bigday{font-size:7.5cqw;font-weight:700;margin-top:.5cqw}
  .feiertag{font-size:3.4cqw;font-weight:600;margin-top:.6cqw}
  .feiertag:empty{display:none}
  .teaser{font-family:"Cormorant Garamond",Georgia,serif;font-size:3.5cqw;line-height:1.35;font-style:italic;opacity:.8;margin-top:auto;padding-top:1.5cqw;max-width:76cqw;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .astro{width:100%;display:flex;justify-content:space-between;font-size:3.1cqw;margin-top:2cqw;letter-spacing:.02em}

  /* ---------- Player ---------- */
  .player{
    position:absolute;top:73.1%;height:11.9%;left:6%;right:5.3%;
    border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
    display:grid;grid-template-columns:auto 1px 1fr auto;align-items:center;gap:0 3.2cqw;
  }
  .play{
    width:12cqw;height:12cqw;border:1.5px solid var(--ink);border-radius:50%;
    display:grid;place-items:center;margin-left:.6cqw;
  }
  .play svg{width:5cqw;height:5cqw;fill:var(--ink)}
  .divider{align-self:stretch;margin:2cqw 0;background:var(--ink)}
  .track{display:flex;flex-direction:column;gap:1.2cqw}
  .times{display:flex;justify-content:space-between;font-size:2.8cqw;opacity:.65;font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4cqw;background:transparent;cursor:pointer;
    --p:0%;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:.8cqw;border-radius:1cqw;
    background:linear-gradient(to right,var(--ink) var(--p),var(--ink-soft) var(--p));
  }
  input[type=range]::-moz-range-track{height:.8cqw;border-radius:1cqw;background:var(--ink-soft)}
  input[type=range]::-moz-range-progress{height:.8cqw;border-radius:1cqw;background:var(--ink)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--ink);margin-top:-1.3cqw;border:0;
  }
  input[type=range]::-moz-range-thumb{width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--ink);border:0}
  .timer{
    display:flex;flex-direction:column;align-items:center;gap:.4cqw;min-width:10cqw;
    font-size:2.8cqw;opacity:.85;
  }
  .timer svg{width:6cqw;height:6cqw;fill:none;stroke:var(--ink);stroke-width:1.6}
  .timer.on svg{fill:var(--ink)}

  /* ---------- Fuß: morgen ---------- */
  .foot{
    position:absolute;top:85%;height:8.9%;left:6%;right:5.3%;
    border-bottom:1px solid var(--ink);
    display:grid;grid-template-columns:9cqw 1fr 9cqw;align-items:center;text-align:center;
  }
  .foot .spruch{font-size:3.8cqw;line-height:1.25;font-style:italic;padding:0 1cqw;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .foot button{font-size:7cqw;line-height:1;opacity:.7;height:100%}
  .foot button:disabled{opacity:.15;cursor:default}

  /* ---------- Abreißen ---------- */
  .page.tear{animation:tear .75s cubic-bezier(.5,0,.75,0) forwards;transform-origin:0 0;z-index:5}
  @keyframes tear{
    30%{transform:rotate(-4deg)}
    to{transform:translate(-15%,-115%) rotate(-18deg);opacity:.2}
  }
  .page.enter .body,.page.enter .head,.page.enter .foot{animation:enter .5s ease-out}
  @keyframes enter{from{opacity:0}}

  /* ---------- Nacht-Overlay (statt Displayhelligkeit) ---------- */
  .night{
    position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;
    transition:opacity .6s ease;
  }
  .night.on{opacity:1;pointer-events:auto;transition:opacity 4s ease}
</style>
</head>
<body>

<main class="sheet" id="sheet">
  <div class="page" id="page">
    <div class="curl"></div>


    <header class="head">
      <div class="title">
        <span class="label">Heute zum Einschlafen</span>
        <h2 class="story" id="storyTitle"></h2>
      </div>
      <div class="date" id="moonCell" title="">
        <svg viewBox="-12 -12 24 24" id="moonIcon"></svg>
        <span class="moonname" id="moonName"></span>
      </div>
    </header>

    <section class="body">
      <div class="toprow">
        <span id="kw"></span>
        <span class="monthlong" id="monthLong"></span>
        <span id="year"></span>
      </div>
      <h1 class="bignum" id="bigNum"></h1>
      <p class="bigday" id="bigDay"></p>
      <p class="feiertag" id="feiertag"></p>
      <p class="teaser" id="teaser"></p>
      <div class="astro" title="Sonnenaufgang · Sonnenuntergang · Mondaufgang · Monduntergang (Hamburg)">
        <span>SA <span id="sa"></span></span><span>SU <span id="su"></span></span>
        <span>MA <span id="ma"></span></span><span>MU <span id="mu"></span></span>
      </div>
    </section>

    <section class="player">
      <button class="play" id="playBtn" aria-label="Abspielen">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4l14 8-14 8z"/></svg>
      </button>
      <span class="divider"></span>
      <div class="track">
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
        <div class="times"><span id="tCur">0:00</span><span id="tRest">-0:00</span></div>
      </div>
      <button class="timer" id="timerBtn" aria-label="Schlaftimer">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <span id="timerLabel">Timer</span>
      </button>
    </section>

    <footer class="foot">
      <button id="prevBtn" aria-label="Vorheriger Tag">‹</button>
      <span class="spruch" id="spruch"></span>
      <button id="nextBtn" aria-label="Nächster Tag">›</button>
    </footer>
  </div>
</main>

<div class="night" id="night" aria-hidden="true"></div>
<audio id="audio" preload="metadata"></audio>

<script>
/* =========================================================
   GESCHICHTEN – später aus JSON laden (z. B. fetch('stories.json'))
   audio: Pfad zur MP3. null = Demo-Rauschen zum Testen.
   Platzhaltertexte – durch echte Einschlaftexte ersetzen.
   ========================================================= */
const STORIES = [
  { title:"Die Berghütte", teaser:"Draußen liegt Schnee auf den Tannen, drinnen knackt das Holz im Ofen. Heute Nacht hat die Hütte nur einen Gast.", audio:null },
  { title:"Das Baumhaus",  teaser:"Zwölf Sprossen bis nach oben. Die Blätter rascheln, und irgendwo zwischen den Ästen wartet ein Abend, der nicht enden muss.", audio:null },
  { title:"Die Zugreise",  teaser:"Das Rattern der Schienen, ein Fenster voller Lichter, die vorbeiziehen. Niemand muss aussteigen, bevor es hell wird.", audio:null },
  { title:"Der Regentag",  teaser:"Tropfen auf dem Dachfenster, eine Decke, ein Tee. Der Regen hat heute nichts anderes vor, als leise zu sein.", audio:null },
];

/* Spruch des Tages – Platzhalter, durch eigene Sprüche ersetzen */
const SPRUECHE = [
  "Der Tag darf jetzt gehen. Er hat genug getan.",
  "Was heute liegen blieb, wartet geduldig bis morgen.",
  "Augen zu. Den Rest erledigt die Nacht.",
  "Auch der Mond fängt jeden Abend klein an.",
  "Leise ist auch eine Art, glücklich zu sein.",
  "Morgen ist ein neues Blatt.",
  "Die Sterne haben keine Eile. Du auch nicht.",
];

/* ---------- Feiertage (Hamburg / bundesweit) ---------- */
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
        g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
        l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function feiertag(d){
  const y=d.getFullYear(), key=(d.getMonth()+1)+'-'+d.getDate();
  const fix={'1-1':'Neujahr','5-1':'Tag der Arbeit','10-3':'Tag der Deutschen Einheit',
             '10-31':'Reformationstag','12-25':'1. Weihnachtstag','12-26':'2. Weihnachtstag'};
  if(fix[key]) return fix[key];
  const o=easter(y), diff=Math.round((startOfDay(d)-o)/864e5);
  return ({'-2':'Karfreitag','0':'Ostersonntag','1':'Ostermontag','39':'Christi Himmelfahrt',
           '49':'Pfingstsonntag','50':'Pfingstmontag'})[diff] || '';
}

/* ---------- Sonne & Mond (Auf-/Untergang) ---------- */
const ORT = { lat:53.55, lng:9.99 };   // Hamburg – hier anpassen
const rad=Math.PI/180, dayMs=864e5, J1970=2440588, J2000=2451545, obl=rad*23.4397;
const toDays = d => d.valueOf()/dayMs - .5 + J1970 - J2000;
const fromJ = j => new Date((j + .5 - J1970)*dayMs);
const ra  = (l,b) => Math.atan2(Math.sin(l)*Math.cos(obl) - Math.tan(b)*Math.sin(obl), Math.cos(l));
const dec = (l,b) => Math.asin(Math.sin(b)*Math.cos(obl) + Math.cos(b)*Math.sin(obl)*Math.sin(l));
function sunTimes(date){
  const lw=rad*-ORT.lng, phi=rad*ORT.lat, J0=.0009;
  const d=toDays(new Date(date.getFullYear(),date.getMonth(),date.getDate(),12));
  const n=Math.round(d-J0-lw/(2*Math.PI));
  const tr=(Ht)=>J0+(Ht+lw)/(2*Math.PI)+n;
  const ds=tr(0), M=rad*(357.5291+.98560028*ds);
  const L=M+rad*(1.9148*Math.sin(M)+.02*Math.sin(2*M)+.0003*Math.sin(3*M))+rad*102.9372+Math.PI;
  const dc=dec(L,0), jt=(x)=>J2000+x+.0053*Math.sin(M)-.0069*Math.sin(2*L);
  const w=Math.acos((Math.sin(-.833*rad)-Math.sin(phi)*Math.sin(dc))/(Math.cos(phi)*Math.cos(dc)));
  const Jnoon=jt(ds), Jset=jt(tr(w));
  return { rise:fromJ(Jnoon-(Jset-Jnoon)), set:fromJ(Jset) };
}
function moonAlt(date){
  const lw=rad*-ORT.lng, phi=rad*ORT.lat, d=toDays(date);
  const L=rad*(218.316+13.176396*d), M=rad*(134.963+13.064993*d), F=rad*(93.272+13.22935*d);
  const l=L+rad*6.289*Math.sin(M), b=rad*5.128*Math.sin(F);
  const H=rad*(280.16+360.9856235*d)-lw-ra(l,b), dc=dec(l,b);
  let h=Math.asin(Math.sin(phi)*Math.sin(dc)+Math.cos(phi)*Math.cos(dc)*Math.cos(H));
  return h + rad*.017/Math.tan(h+rad*10.26/(h+rad*5.10));
}
function moonTimes(date){
  const t=new Date(date.getFullYear(),date.getMonth(),date.getDate()).getTime();
  const hAt=x=>moonAlt(new Date(t+x*3600e3))-.133*rad;
  let h0=hAt(0), rise=null, set=null;
  for(let i=1;i<=24;i+=2){
    const h1=hAt(i), h2=hAt(i+1), a=(h0+h2)/2-h1, b=(h2-h0)/2, xe=-b/(2*a), ye=(a*xe+b)*xe+h1, D=b*b-4*a*h1;
    let roots=0, x1=0, x2=0;
    if(D>=0){ const dx=Math.sqrt(D)/(Math.abs(a)*2); x1=xe-dx; x2=xe+dx;
      if(Math.abs(x1)<=1) roots++; if(Math.abs(x2)<=1) roots++; if(x1<-1) x1=x2; }
    if(roots===1){ if(h0<0) rise=i+x1; else set=i+x1; }
    else if(roots===2){ rise=i+(ye<0?x2:x1); set=i+(ye<0?x1:x2); }
    if(rise!==null && set!==null) break;
    h0=h2;
  }
  return { rise: rise===null?null:new Date(t+rise*3600e3), set: set===null?null:new Date(t+set*3600e3) };
}
const hm = d => d && !isNaN(d) ? d.getHours()+'.'+String(d.getMinutes()).padStart(2,'0') : '–';
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7);
}

/* ---------- Helfer ---------- */
const $ = id => document.getElementById(id);
const audio = $('audio'), page = $('page'), night = $('night');
const DIM_DELAY = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dim-delay')) * 1000 || 10000;

const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const dayOfYear = d => Math.round((startOfDay(d) - new Date(d.getFullYear(),0,1)) / 864e5);
const storyFor = d => STORIES[dayOfYear(d) % STORIES.length];
const fmt = s => { if(!isFinite(s)) s=0; s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

const TODAY = startOfDay(new Date());
// Zum Testen: ?tag=2026-12-24
const param = new URLSearchParams(location.search).get('tag');
let current = param && !isNaN(new Date(param)) ? startOfDay(new Date(param+'T00:00')) : TODAY;
let maxDay = current > TODAY ? current : TODAY;

/* ---------- Mondphase ---------- */
function moonPhase(d){
  const ref = Date.UTC(2000,0,6,18,14), syn = 29.530588853;
  const days = (d.getTime() + 12*3600e3 - ref) / 864e5;
  return ((days % syn) + syn) % syn / syn;     // 0 = Neumond, .5 = Vollmond
}
function moonName(p){
  if(p<.03||p>.97) return 'Neumond';
  if(p<.22) return 'zunehmende Sichel';
  if(p<.28) return 'erstes Viertel';
  if(p<.47) return 'zunehmender Mond';
  if(p<.53) return 'Vollmond';
  if(p<.72) return 'abnehmender Mond';
  if(p<.78) return 'letztes Viertel';
  return 'abnehmende Sichel';
}
function drawMoon(p){
  const r = 10, k = Math.cos(p*2*Math.PI), rx = Math.abs(k)*r, waxing = p < .5;
  const outer = waxing ? 1 : 0;
  const inner = waxing ? (k>0?0:1) : (k>0?1:0);
  const lit = `M0,${-r} A${r},${r} 0 0 ${outer} 0,${r} A${rx},${r} 0 0 ${inner} 0,${-r}Z`;
  $('moonIcon').innerHTML =
    `<circle r="${r}" fill="none" stroke="var(--ink)" stroke-width="1"/>` +
    (p<.03||p>.97 ? '' : `<path d="${lit}" fill="var(--ink)"/>`);
}

/* ---------- Seite befüllen ---------- */
function render(){
  const s = storyFor(current);
  $('storyTitle').textContent = s.title;
  $('year').textContent = current.getFullYear();
  $('monthLong').textContent = current.toLocaleDateString('de-DE',{month:'long'});
  $('bigNum').textContent = current.getDate();
  $('bigDay').textContent = current.toLocaleDateString('de-DE',{weekday:'long'});
  $('teaser').textContent = s.teaser;
  const ft = feiertag(current);
  $('feiertag').textContent = ft;
  page.classList.toggle('rot', current.getDay()===0 || !!ft);
  $('spruch').textContent = SPRUECHE[dayOfYear(current) % SPRUECHE.length];
  const p = moonPhase(current); drawMoon(p); $('moonName').textContent = moonName(p);
  $('kw').textContent = 'Wo ' + isoWeek(current);
  const sun = sunTimes(current), moon = moonTimes(current);
  $('sa').textContent = hm(sun.rise); $('su').textContent = hm(sun.set);
  $('ma').textContent = hm(moon.rise); $('mu').textContent = hm(moon.set);
  $('nextBtn').disabled = current >= maxDay;
  document.title = s.title + ' · Schlaf Kalender';

  fitDate();
  stopPlayback();
  audio.src = s.audio || demoAudio();
  setMediaSession(s);
}

/* ---------- Tageszahl automatisch so groß wie möglich, ohne über die Linien zu laufen ---------- */
function fitDate(){
  const body = page.querySelector('.body'), num = $('bigNum');
  num.style.fontSize = '';
  let size = parseFloat(getComputedStyle(num).fontSize), guard = 60;
  while(body.scrollHeight > body.clientHeight + 1 && guard--){
    size *= .96; num.style.fontSize = size + 'px';
  }
}
addEventListener('resize', fitDate);
if(document.fonts) document.fonts.ready.then(fitDate);

/* ---------- Abreißen / Tag wechseln ---------- */
let busy = false;
function goTo(delta){
  const target = addDays(current, delta);
  if(busy || target > maxDay) return;
  busy = true;
  if(delta > 0){
    const torn = page.cloneNode(true);
    torn.removeAttribute('id');
    torn.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    page.after(torn);
    current = target; render();
    torn.classList.add('tear');
    torn.addEventListener('animationend', () => { torn.remove(); busy = false; }, {once:true});
  } else {
    current = target; render();
    page.classList.remove('enter'); void page.offsetWidth; page.classList.add('enter');
    setTimeout(() => busy = false, 500);
  }
}
$('nextBtn').onclick = () => goTo(1);
$('prevBtn').onclick = () => goTo(-1);
document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight') goTo(1);
  if(e.key==='ArrowLeft') goTo(-1);
  if(e.key===' '){ e.preventDefault(); togglePlay(); }
});
let tx = null;
$('sheet').addEventListener('touchstart', e => { if(e.target.closest('input,button')) return; tx = e.touches[0].clientX; }, {passive:true});
$('sheet').addEventListener('touchend', e => {
  if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if(dx < -60) goTo(1); else if(dx > 60) goTo(-1);
});

/* ---------- Player ---------- */
const PLAY = '<path d="M7 4l14 8-14 8z"/>', PAUSE = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
function togglePlay(){ audio.paused ? audio.play() : audio.pause(); }
function stopPlayback(){ audio.pause(); clearSleep(); undim(); }
$('playBtn').onclick = togglePlay;

audio.addEventListener('play', () => {
  $('playIcon').innerHTML = PAUSE; $('playBtn').setAttribute('aria-label','Pause');
  audio.volume = 1; scheduleDim(); armSleep();
});
audio.addEventListener('pause', () => {
  $('playIcon').innerHTML = PLAY; $('playBtn').setAttribute('aria-label','Abspielen');
  clearTimeout(dimT); clearSleepTick();
});
audio.addEventListener('ended', () => { audio.currentTime = 0; });
audio.addEventListener('timeupdate', updateTime);
audio.addEventListener('loadedmetadata', updateTime);

const seek = $('seek'); let seeking = false;
seek.addEventListener('input', () => { seeking = true; seek.style.setProperty('--p', seek.value/10+'%'); });
seek.addEventListener('change', () => {
  if(isFinite(audio.duration)) audio.currentTime = seek.value/1000 * audio.duration;
  seeking = false;
});
function updateTime(){
  const d = audio.duration, c = audio.currentTime;
  $('tCur').textContent = fmt(c);
  $('tRest').textContent = '-' + fmt((d||0) - c);
  if(!seeking && isFinite(d) && d>0){ seek.value = c/d*1000; seek.style.setProperty('--p', c/d*100+'%'); }
}

/* ---------- Abdunkeln nach X Sekunden Wiedergabe ---------- */
let dimT = null;
function scheduleDim(){ clearTimeout(dimT); dimT = setTimeout(() => { if(!audio.paused) night.classList.add('on'); }, DIM_DELAY); }
function undim(){ clearTimeout(dimT); night.classList.remove('on'); }
night.addEventListener('click', () => { undim(); if(!audio.paused) scheduleDim(); });

/* ---------- Schlaftimer ---------- */
const STEPS = [0,15,30,45,60]; let stepI = 0, sleepEnd = null, sleepTick = null;
$('timerBtn').onclick = () => {
  stepI = (stepI+1) % STEPS.length;
  $('timerBtn').classList.toggle('on', STEPS[stepI] > 0);
  sleepEnd = null; armSleep(); showTimer();
};
function armSleep(){
  clearSleepTick();
  if(!STEPS[stepI] || audio.paused) return;
  if(!sleepEnd) sleepEnd = Date.now() + STEPS[stepI]*60e3;
  sleepTick = setInterval(() => {
    showTimer();
    if(Date.now() >= sleepEnd){ clearSleepTick(); fadeOutAndPause(); }
  }, 1000);
}
function clearSleepTick(){ clearInterval(sleepTick); sleepTick = null; }
function clearSleep(){ clearSleepTick(); sleepEnd = null; showTimer(); }
function showTimer(){
  const m = STEPS[stepI];
  if(!m){ $('timerLabel').textContent = 'Timer'; return; }
  if(sleepEnd){ $('timerLabel').textContent = Math.ceil((sleepEnd-Date.now())/60e3) + ' min'; }
  else $('timerLabel').textContent = m + ' min';
}
function fadeOutAndPause(){
  // iOS ignoriert audio.volume – dort wird einfach pausiert
  const start = audio.volume, t0 = Date.now(), dur = 20000;
  const f = setInterval(() => {
    const k = 1 - (Date.now()-t0)/dur;
    if(k <= 0 || audio.paused){ clearInterval(f); audio.pause(); audio.volume = start; sleepEnd = null; showTimer(); return; }
    audio.volume = Math.max(0, start*k);
  }, 200);
}

/* ---------- Sperrbildschirm (Media Session) ---------- */
function setMediaSession(s){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title:s.title, artist:'Jens Salsa', album:'Schlaf Kalender' });
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
}

/* ---------- Demo-Audio: leises braunes Rauschen, 90 s ---------- */
let demoURL = null;
function demoAudio(){
  if(demoURL) return demoURL;
  const sr = 22050, n = sr*90, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  const str = (o,s) => [...s].forEach((c,i) => v.setUint8(o+i, c.charCodeAt(0)));
  str(0,'RIFF'); v.setUint32(4,36+n*2,true); str(8,'WAVE'); str(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,'data'); v.setUint32(40,n*2,true);
  let last = 0; const fade = sr*2;
  for(let i=0;i<n;i++){
    last = (last + .02*(Math.random()*2-1)) / 1.02;
    const env = Math.min(1, i/fade, (n-i)/fade);
    v.setInt16(44+i*2, Math.max(-1,Math.min(1,last*3.5)) * env * 0x7fff * .45, true);
  }
  return demoURL = URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}

/* ---------- Eigenes Hintergrundbild erkennen ---------- */
if(!getComputedStyle(document.documentElement).getPropertyValue('--sheet-image').includes('svg+xml'))
  document.body.classList.add('has-image');

render();
</script>
