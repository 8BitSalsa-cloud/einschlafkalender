<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einschlafkalender – kommt bald</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      background: #0d0a06;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: url("assets/blatt.webp") center / cover no-repeat;
      width: min(360px, 100%);
      aspect-ratio: 2 / 3;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      padding: 2.5rem;
      text-align: center;
      color: #38312a;
    }

    .moon {
      font-size: 2.8rem;
      line-height: 1;
      opacity: .75;
    }

    h1 {
      font-family: "Archivo", sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .6;
    }

    p {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.35rem;
      font-style: italic;
      line-height: 1.5;
      opacity: .85;
    }

    .soon {
      font-family: "Archivo", sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: .45;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="moon">🌙</div>
    <h1>Einschlafkalender</h1>
    <p>Jeden Abend eine neue Geschichte zum Einschlafen.</p>
    <span class="soon">Kommt bald</span>
  </div>
</body>
</html>
